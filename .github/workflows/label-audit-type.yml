name: Label audit report type

# Reporters from other teams cannot add labels, so copy the form's Type into a type:* label.
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label-type:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/label-audit-type.cjs`);
            await run({github, context});
