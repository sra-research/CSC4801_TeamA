name: "Bug report: functional"
description: Report a reproducible functional bug found during the Week 12 peer review
title: "[AUDIT] "
labels:
  - "audit:report"
  - "status:needs-triage"
  - "type:functional"
body:
  - type: markdown
    attributes:
      value: |
        This form files a report of type **functional** and adds `type:functional` automatically. A required workflow, specification rule, or required test/CI behavior is missing, incorrect, crashes, or cannot be completed. If your finding is a different type, go back and choose the matching form.

        Read the course `final_project/PEER_REVIEW.md` first and search existing issues before filing. Audit the latest commit on the target team's `main` branch, built from the repository's `Dockerfile`. Never post credentials or personal data.

        Reports still awaiting triage are automatically confirmed after 25 hours from creation if no human repository owner, organization member, or collaborator other than the reporter has commented. Reporter follow-ups and bot comments do not count as responses. Checks run every hour and may be delayed by GitHub. Timeout confirmation leaves the issue open and does not replace instructor review of validity.
  - type: input
    id: reporting-team
    attributes:
      label: Reporting team
      placeholder: Team number and name
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: Full 40-character SHA of the commit where you observed the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal test case
      description: Numbered, exact commands or UI actions that reproduce the bug.
      placeholder: |
        1. Run ...
        2. Sign in as ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
